validation_run:
  run_id: synth-fin-cre-demo-baseline
  model_id: synth-fin-cre-xgb
  model_version: v1.0
  model: models/synth-fin-cre-xgb-v1.0.joblib
  dataset: data/synthetic_cre/validation.csv
  decision_column: credit_decision_favorable
  label_column: creditworthy
  intended_use: Commercial real-estate (CRE) credit decisioning support for fair-lending review demonstration.
  methodology_type: statistical_credit_model
  theory_basis: Gradient-boosted statistical credit-risk model trained on a synth-fin synthetic CRE panel.
  guidance_version: OCC-2026-13
  limitations_text: >-
    **Demo limitations:** This validation uses a synth-fin synthetic commercial
    real-estate (CRE) panel (`synth-fin generate --scenario base
    --bias-profile proxy_discrimination_mild --n 5000 --seed 42`), not real
    borrower or property data. `minority_tract_top_quintile` is a geography
    proxy for census-tract minority composition (`minority_tract_pct`
    binned at its 80th percentile) -- **not** surname/BISG race or ethnicity
    inference; it complements, and does not replace, this workbench's P4
    BISG architecture demo. The subgroup adverse-decision shift below is a
    synth-fin-injected ground-truth bias profile
    (`proxy_discrimination_mild`), not an observed real-world disparity.
    Adverse-action Reg B specific-reasons mapping is out of scope for this
    demo (`modules.adverse_action_translator: false`) -- the CRE feature
    catalog is not yet represented in `workbench.adverse_action`'s
    German-Credit-specific mapping-rules catalog.
  protected_attributes:
    - name: minority_tract_top_quintile
      source: derived
      reference_group: below_top_quintile
  regulatory_frame:
    federal_ecoa: proxy_discrimination
    fha_overlay: false
    state_overlay: none
  materiality:
    exposure: 0.15
    exposure_unit: portfolio_pct
    purpose: credit_decisioning
  modules:
    bias_battery: true
    adverse_action_translator: false
    drift_monitor: false
  audit:
    finos_tier: 2
    actor: Steven L. Sorenson
    db_path: workbench.db
  outputs:
    report_format: [markdown]
    artifact_dir: artifacts/{run_id}
