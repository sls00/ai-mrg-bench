[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workbench"
version = "0.0.0"
description = "AI Model Risk & Governance Workbench — validation, audit, and OCC reporting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BlueOak-1.0.0" }
authors = [{ name = "Steven L. Sorenson" }]
dependencies = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "fairlearn>=0.10",
    # P0 compat smoke pin for German Credit workflow.
    "aequitas==1.1.0",
    "shap>=0.45",
    "surgeo>=1.1.2",
    "joblib>=1.3",
    "xgboost>=2.0",
    "jinja2>=3.1",
    "markdown>=3.5",
    "pyarrow>=15.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.8", "plotly>=5.18"]
analytical = ["duckdb>=0.10"]
# Marker extra: `workbench ui` execs `evidence-workbench` from PATH (no reverse import).
ui = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-PyYAML",
    "types-Markdown",
]

[project.scripts]
workbench = "workbench.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.hatch.build.targets.sdist]
include = ["src/workbench"]

[tool.uv]
# aequitas pulls numba→llvmlite; pin modern llvmlite for Python 3.11 CI matrix.
override-dependencies = ["llvmlite>=0.43.0", "numba>=0.59.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "phase0: P0 integration and golden tests",
    "phase1: P1 adverse-action slice",
    "phase2: P2 drift, API, and full demo",
    "phase3: P3 CA/CO state-overlay differentiation demo",
    "phase4: P4 Home Credit + BISG (stub)",
    "phase5: P5 synth-fin CRE fair-lending demo (geography proxy, CI-gated)",
    "api: FastAPI endpoint smoke tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["workbench"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "aequitas",
    "fairlearn",
    "fairlearn.*",
    "joblib",
    "pandas",
    "sklearn",
    "sklearn.*",
    "shap",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true
